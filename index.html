<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AFKProbably 3D printable meshes, commercial licensing, and custom commissions."
  >

  <title>AFKProbably</title>

  <link
    rel="icon"
    href="/assets/favicon.svg"
    type="image/svg+xml"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #32104f;

      background:
        linear-gradient(
          135deg,
          #ddd3ff 0%,
          #cbb5ff 35%,
          #ac91ff 65%,
          #8b35ff 100%
        );
    }

    .page {
      width: min(900px, 100%);

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    /*
      BRAND
    */

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      margin-bottom: 30px;
    }

    .brand img {
      width: 78px;
      height: 78px;

      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-name {
      margin: 0;

      color: #6419e8;

      font-size:
        clamp(
          3rem,
          8vw,
          6rem
        );

      font-weight: 900;

      line-height: 1;

      letter-spacing: -0.045em;
    }

    /*
      LOADING CARD
    */

    .card {
      width: min(560px, 100%);

      padding:
        38px
        32px;

      background:
        rgba(
          255,
          255,
          255,
          0.9
        );

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.75
        );

      border-radius: 28px;

      box-shadow:
        0
        26px
        70px
        rgba(
          84,
          26,
          145,
          0.16
        );

      backdrop-filter:
        blur(12px);
    }

    .eyebrow {
      margin:
        0
        0
        12px;

      color: #701be2;

      font-size: 0.82rem;

      font-weight: 900;

      letter-spacing: 0.18em;
    }

    h1 {
      margin:
        0
        0
        14px;

      color: #4e129b;

      font-size:
        clamp(
          2.2rem,
          6vw,
          3.7rem
        );

      line-height: 1;

      letter-spacing: -0.035em;
    }

    .message {
      margin:
        0
        auto
        24px;

      max-width: 430px;

      color: #5b4967;

      font-size: 1rem;

      line-height: 1.6;
    }

    /*
      BUTTON
    */

    .shop-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 50px;

      padding:
        0
        26px;

      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          #7020ed,
          #9511ff
        );

      color: white;

      font-size: 1rem;
      font-weight: 900;

      text-decoration: none;

      box-shadow:
        0
        12px
        28px
        rgba(
          110,
          24,
          225,
          0.25
        );

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .shop-button:hover {
      transform:
        translateY(-2px);

      box-shadow:
        0
        15px
        34px
        rgba(
          110,
          24,
          225,
          0.32
        );
    }

    .small-note {
      margin:
        18px
        0
        0;

      color: #786984;

      font-size: 0.85rem;
    }

    /*
      FOOTER
    */

    footer {
      margin-top: 24px;

      color: #4a176b;

      font-size: 0.86rem;
    }

    footer a {
      color: inherit;

      font-weight: 700;
    }

    /*
      MOBILE
    */

    @media (max-width: 600px) {

      body {
        padding:
          24px
          15px;
      }

      .brand {
        gap: 8px;

        margin-bottom: 24px;
      }

      .brand img {
        width: 54px;
        height: 54px;
      }

      .brand-name {
        font-size:
          clamp(
            2.6rem,
            13vw,
            4rem
          );
      }

      .card {
        padding:
          32px
          20px;
      }
    }

  </style>


  <!--
    Send the main domain directly to the shop.
    JavaScript does it immediately.
    The meta refresh is a backup.
  -->

  <meta
    http-equiv="refresh"
    content="1; url=/shop.html"
  >

  <script>
    window.addEventListener(
      'DOMContentLoaded',
      () => {

        setTimeout(
          () => {
            window.location.replace(
              '/shop.html'
            );
          },
          250
        );

      }
    );
  </script>

</head>


<body>

  <main class="page">

    <div class="brand">

      <img
        src="/assets/moon-mark.png"
        alt=""
      >

      <div class="brand-name">
        AFKProbably
      </div>

    </div>


    <section class="card">

      <p class="eyebrow">
        AFKPROBABLY 3D
      </p>

      <h1>
        Opening the Shop
      </h1>

      <p class="message">
        Taking you to AFKProbably's
        3D printable meshes,
        commercial licensing,
        and commissions.
      </p>

      <a
        class="shop-button"
        href="/shop.html"
      >
        Enter Shop
      </a>

      <p class="small-note">
        If the shop doesn't open automatically,
        click the button above.
      </p>

    </section>


    <footer>

      <a href="/privacy.html">
        Privacy Policy
      </a>

      &nbsp;•&nbsp;

      <a href="/terms.html">
        Terms of Use
      </a>

    </footer>

  </main>

</body>

</html>
